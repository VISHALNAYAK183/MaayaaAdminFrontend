name: Deploy Admin Frontend to AWS

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS account
        run: |
          aws sts get-caller-identity

      - name: Deploy to Admin S3
        run: |
          echo "Deploying Admin Frontend to S3..."
          aws s3 sync dist/ s3://${{ secrets.ADMIN_S3_BUCKET }} --delete


      - name: Verify Admin CloudFront distribution
        run: |
          echo "Testing Admin CloudFront distribution..."

          aws cloudfront get-distribution \
            --id ${{ secrets.ADMIN_CLOUDFRONT_DISTRIBUTION_ID }} \
            --output json


      - name: Invalidate Admin CloudFront cache
        run: |
          echo "Invalidating Admin CloudFront cache..."

          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.ADMIN_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"


      - name: Deployment completed
        run: |
          echo "========================================="
          echo "Admin Frontend deployment successful!"
          echo "========================================="